services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/max20050/ingsoft3-backend:v0.1.0
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      DATASOURCE_ENCRYPTION_KEY: ${DATASOURCE_ENCRYPTION_KEY}
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY}
      FRONTEND_URL: http://localhost
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      # Off by default: ai-summary blocks aren't meant to ship until a cost
      # estimator exists. Set AI_SUMMARY_ENABLED=true in .env to turn them on
      # locally.
      AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-false}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  # NOTE: this image tag must come from a build that bakes
  # NEXT_PUBLIC_API_URL="" (see frontend/Dockerfile); su nginx interno
  # vive en frontend/nginx/default.conf, no acá.
  frontend:
    image: ghcr.io/max20050/ingsoft3-frontend:v0.1.0
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
