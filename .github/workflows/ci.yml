name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    name: Build backend (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the backend tests stage
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Run backend tests with coverage
        run: |
          mkdir -p backend-coverage
          docker run --rm \
            -e COVERAGE_PROFILE=/out/coverage.out \
            -v "${{ github.workspace }}/backend-coverage:/out" \
            backend-test:ci

      - name: Set up Go
        if: ${{ !cancelled() }}
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Coverage report
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          go tool cover -func=../backend-coverage/coverage.out > ../backend-coverage/summary.txt
          go tool cover -html=../backend-coverage/coverage.out -o ../backend-coverage/coverage.html
          {
            echo "### Backend coverage"
            echo ""
            echo '```'
            tail -1 ../backend-coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish backend coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      - name: Extraer cobertura total
        id: cov
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          TOTAL=$(tail -1 backend-coverage/summary.txt | grep -oE '[0-9]+\.[0-9]+%')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          PCT=${TOTAL%\%}
          if awk "BEGIN{exit !($PCT >= 80)}"; then COLOR=brightgreen
          elif awk "BEGIN{exit !($PCT >= 50)}"; then COLOR=yellow
          else COLOR=red
          fi
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"

      - name: Actualizar badge de cobertura (gist)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: b3a3805ef1a1702baeeb0cbc9716b39b
          filename: coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.total }}
          color: ${{ steps.cov.outputs.color }}

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/max20050/ingsoft3-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the frontend tests stage
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Run frontend tests with coverage
        run: |
          docker run --rm \
            -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" \
            frontend-test:ci

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Frontend coverage');
            console.log('| metrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publish frontend coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/max20050/ingsoft3-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    name: Deploy a QA
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: qa
    steps:
      - name: Desplegar en QA la imagen del commit (backend + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/max20050/ingsoft3-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/max20050/ingsoft3-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://ingsoft3-api-qa-6umv.onrender.com
          URL_FRONT: https://ingsoft3-front-qa-dtom.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde (API + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  integracion:
    name: Integración contra la api de QA
    runs-on: ubuntu-latest
    needs: deploy-qa # QA ya está ejecutando la imagen de ESTA corrida
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install (sin browser)
        run: npm ci
        working-directory: ./frontend

      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://ingsoft3-api-qa-6umv.onrender.com
        run: npx playwright test e2e/api.spec.ts
        working-directory: ./frontend

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    name: e2e contra QA
    runs-on: ubuntu-latest
    needs: integracion # si la api está rota, no gastamos un browser en confirmarlo
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra QA
        env:
          E2E_BASE_URL: https://ingsoft3-front-qa-dtom.onrender.com
        run: npx playwright test e2e/recipients.spec.ts
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    name: Deploy a PROD
    runs-on: ubuntu-latest
    needs: e2e # el gate: sin e2e verde, ni siquiera se pide aprobación
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Desplegar en PROD la MISMA imagen que verificó QA
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/max20050/ingsoft3-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/max20050/ingsoft3-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: https://ingsoft3-api-prod-hb4s.onrender.com
          URL_FRONT: https://ingsoft3-front-prod-5clx.onrender.com
        run: |
          echo "Esperando a que PROD esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ PROD responde (API + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
